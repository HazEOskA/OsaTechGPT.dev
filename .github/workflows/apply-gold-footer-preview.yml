name: Apply gold footer preview

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-footer:
    if: github.head_ref == 'assistant/footer-gold-preview-20260803'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Replace footer only
        env:
          CSS_B64: 
          FOOTER_B64:  yMmw   DCtyBERVBMT1k8L3NwYW4+PC9kaXY+CiAgPC9kaXY+CjwvZm9vdGVyPg==
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, os, re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          css = base64.b64decode(os.environ["CSS_B64"]).decode("utf-8")
          footer = base64.b64decode(os.environ["FOOTER_B64"]).decode("utf-8")

          css_pattern = re.compile(r'\.osa-footer\{.*?@media\(max-width:420px\)\{\.osa-social-grid\{grid-template-columns:1fr\}\}', re.S)
          footer_pattern = re.compile(r'<footer class="osa-footer".*?</footer>', re.S)

          text, css_count = css_pattern.subn(css, text, count=1)
          text, footer_count = footer_pattern.subn(footer, text, count=1)

          if css_count != 1 or footer_count != 1:
              raise SystemExit(f"Expected exactly one footer CSS and HTML block; got CSS={css_count}, HTML={footer_count}")

          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate footer-only patch
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("index.html").read_text(encoding="utf-8")
          checks = {
              "single footer": text.count('<footer class="osa-footer"') == 1,
              "six official icon SVGs": text.count('<span class="osa-social-icon" aria-hidden="true"><svg') == 6,
              "gold footer": 'background:linear-gradient(135deg,#6f4d08' in text,
              "old text icons removed": '<span class="osa-social-icon">IG</span>' not in text,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("Validation failed: " + ", ".join(failed))
          print("Footer validation passed.")
          PY
      - name: Commit footer patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No footer changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: replace footer with official gold social icons"
          git push origin HEAD:${{ github.head_ref }}
