name: OSA Perfect Audit Pass V1

on:
  push:
    branches:
      - preview/static-osa-cookies-privacy
    paths:
      - .github/workflows/osa-perfect-audit-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract exact audit and source context
        run: |
          python3 <<'PY'
          import json, re
          from pathlib import Path

          evidence = json.loads(Path('audit-v1-evidence.json').read_text(encoding='utf-8'))
          html = Path('index.html').read_text(encoding='utf-8')
          out = []
          out.append('OSA PERFECT AUDIT PASS V1 — EVIDENCE')
          out.append('')
          out.append('CATEGORY SCORES')
          for k,v in evidence.get('categories', {}).items():
              out.append(f'{k}: {v.get("score")}')
          out.append('')
          out.append('ACCESSIBILITY FAIL IDS')
          for a in evidence.get('accessibilityFailures', []):
              out.append(f'- {a.get("id")}: {a.get("title")}')
              for item in a.get('items', []):
                  n=item.get('node', {})
                  if n.get('selector'): out.append(f'  selector: {n.get("selector")}')
                  if n.get('snippet'): out.append(f'  snippet: {n.get("snippet")}')
                  if n.get('explanation'): out.append(f'  why: {n.get("explanation").replace(chr(10), " | ")}')
          out.append('')
          out.append('AGENTIC')
          for a in evidence.get('agentic', []):
              out.append(f'- {a.get("id")}: score={a.get("score")} display={a.get("displayValue")}')
          out.append('')

          patterns = [
              'class="oxf-sysnav"',
              'aria-selected',
              'class="reel reel-link"',
              'Mafia AI Studio',
              'setAttribute("aria-selected"',
              "setAttribute('aria-selected'",
              '.ariaSelected',
          ]
          lines = html.splitlines()
          out.append('SOURCE CONTEXT')
          seen=set()
          for pat in patterns:
              out.append(f'\n### pattern: {pat}')
              found=False
              for i,line in enumerate(lines):
                  if pat in line:
                      found=True
                      lo=max(0,i-3); hi=min(len(lines),i+4)
                      key=(lo,hi)
                      if key in seen: continue
                      seen.add(key)
                      for j in range(lo,hi):
                          out.append(f'{j+1}: {lines[j]}')
              if not found: out.append('(not found)')

          # llms.txt deterministic checks used by Lighthouse 13.x
          llms=Path('llms.txt').read_text(encoding='utf-8')
          out.append('\nLLMS CHECK')
          out.append(f'bytes={len(llms.encode("utf-8"))}')
          out.append(f'has_h1={bool(re.search(r"^\\s*#\\s+.+", llms, re.M))}')
          out.append(f'has_markdown_link={bool(re.search(r"\\[[^\\]]+\\]\\([^\\)]+\\)", llms))}')
          out.append(f'plain_url_count={len(re.findall(r"https?://", llms))}')

          Path('audit-v1-summary.txt').write_text('\n'.join(out)+'\n', encoding='utf-8')
          PY
          cat audit-v1-summary.txt

      - name: Commit summary only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-v1-summary.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: capture minimal OSA audit V1 source context"
          git push origin HEAD:preview/static-osa-cookies-privacy
