name: Apply final portfolio

on:
  push:
    branches:
      - assistant/final-portfolio-final

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode exact patch
        run: |
          base64 -d .osa/apply_final_portfolio.py.gz.b64 | gzip -d > .osa/apply_final_portfolio.py

      - name: Apply approved changes
        run: python .osa/apply_final_portfolio.py

      - name: Validate locked specification
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          assert s.count('<article class="client-project-card">') == 4
          order = [
              s.index('<h3>APR — Agent Proof Runtime</h3>'),
              s.index('<h3>Hydra / Hermes</h3>'),
              s.index('<h3>DRK Drill Ulica</h3>'),
              s.index('<h3>Michael Angelo</h3>'),
          ]
          assert order == sorted(order)
          assert 'Agentic City OS' not in s
          assert len(re.findall(r'osatechgpt_portfolio_assets/apr-\d{2}\.webp', s)) == 3
          assert len(re.findall(r'osatechgpt_portfolio_assets/hydra-\d{2}\.webp', s)) == 9
          assert 'https://agent-proof-runtime-production.up.railway.app/' in s
          assert 'https://github.com/HazEOskA/agent-proof-runtime' in s
          assert 'https://github.com/HazEOskA/hydra-hermes-lab' in s
          assert 'LIVE · PRIVATE VPS' in s
          assert 'https://drk-drill-ulica.vercel.app/' in s
          assert 'https://github.com/HazEOskA/drk-drill-ulica' in s
          assert 'https://michael-angelo-pro.vercel.app/' in s
          assert 'https://github.com/HazEOskA/Da-Vinci-Agent-the-Ideal-' in s
          assert 'data-live-url="https://mafia-ai-studio.vercel.app/"' in s
          hero_video = re.search(r'<video autoplay="" class="reel-v"[^>]*>', s).group(0)
          assert 'loop' not in hero_video
          assert "video.addEventListener('ended'" in s
          assert s.index('id="kontakt"') < s.index('id="projekty"')
          assert '<footer class="osa-footer"' in s
          for item in ('Instagram', 'LinkedIn', 'GitHub', 'E-mail', '>X<', 'Facebook'):
              assert item in s
          assert 'nextStrike=performance.now()+450+Math.random()*1000' in s
          assert 'nextStrike=t+1200+Math.random()*2800' in s
          assert 'CO PROPONUJEMY · OD PROBLEMU DO WDROŻENIA' in s
          assert 'mailto:osabarca@gmail.com?subject=' in s

          for prefix, count in [('apr', 3), ('hydra', 9)]:
              for i in range(1, count + 1):
                  asset = Path(f'osatechgpt_portfolio_assets/{prefix}-{i:02d}.webp')
                  assert asset.exists() and asset.stat().st_size > 4000, asset

          print('VALIDATION_OK')
          PY

      - name: Commit final version only
        run: |
          rm -rf .osa .github/workflows/apply-final-portfolio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html osatechgpt_portfolio_assets .osa .github/workflows/apply-final-portfolio.yml
          git commit -m "feat: finalize APR and Hydra portfolio"
          git push origin HEAD:assistant/final-portfolio-final
