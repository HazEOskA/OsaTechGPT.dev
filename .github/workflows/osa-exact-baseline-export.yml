name: OSA Apply Exact Preview Patch

on:
  push:
    branches:
      - preview/static-osa-cookies-privacy

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "ac232ca596b6f56c8e85d82b198d5af759e65780"
          test -s scripts/apply_static_osa_cookies_privacy.py

      - name: Apply approved patch
        run: python3 scripts/apply_static_osa_cookies_privacy.py

      - name: Verify scope and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="osa-cookie-banner"' index.html
          grep -q 'id="osa-cookie-notice"' index.html
          grep -q 'href="/privacy.html"' index.html
          grep -q 'osatechgpt_portfolio_assets/osa-static-guide.webp' index.html
          test -s privacy.html

          rm -f .github/workflows/osa-exact-baseline-export.yml
          rm -f scripts/apply_static_osa_cookies_privacy.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          expected=$'.github/workflows/osa-exact-baseline-export.yml\nindex.html\nprivacy.html\nscripts/apply_static_osa_cookies_privacy.py'
          actual="$(git diff --cached --name-only | sort)"
          printf 'CHANGED FILES:\n%s\n' "$actual"
          test "$actual" = "$expected"

          git commit -m "feat: static OSA, cookie notice and privacy"
          git push origin HEAD:preview/static-osa-cookies-privacy

      - name: Upload patched preview source
        uses: actions/upload-artifact@v4
        with:
          name: osatechgpt-patched-preview-source
          path: |
            index.html
            privacy.html
          if-no-files-found: error
          retention-days: 1
