name: Restore approved preview with APR and footer

on:
  push:
    paths:
      - '.github/workflows/apply-static-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild current artifact only to recover supplied APR screenshots
        run: npm run build

      - name: Extract the two supplied APR screenshots
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, base64
          text=Path('public/index.html').read_text(encoding='utf-8')
          marker=text.find('Agent Proof Runtime')
          start=text.rfind('<article',0,marker)
          end=text.find('</article>',marker)
          if marker < 0 or start < 0 or end < 0:
              raise SystemExit('APR_CARD_NOT_FOUND_IN_CURRENT_ARTIFACT')
          images=re.findall(r'data:image/jpeg;base64,([^"\']+)',text[start:end])
          if len(images) < 2:
              raise SystemExit('APR_SCREENSHOTS_NOT_FOUND')
          out=Path('osatechgpt_portfolio_assets')
          out.mkdir(exist_ok=True)
          (out/'apr-mission-control.jpg').write_bytes(base64.b64decode(images[1]))
          (out/'apr-evidence-history.jpg').write_bytes(base64.b64decode(images[0]))
          print('APR_SCREENSHOTS_EXTRACTED',len(images[1]),len(images[0]))
          PY

      - name: Restore exact first preview and apply only APR plus footer
        shell: bash
        run: |
          git show 0a4ad8e7b4529141e34085302c7246be1132bc6b:index.html > index.html
          printf '%s' '' | base64 -d > /tmp/patch_repo.py
          python /tmp/patch_repo.py

      - name: Remove drift build files
        shell: bash
        run: |
          rm -rf .static public
          rm -f package.json build.mjs vercel.json

      - name: Validate and commit static result
        shell: bash
        run: |
          test -s index.html
          test -s osatechgpt_portfolio_assets/apr-mission-control.jpg
          test -s osatechgpt_portfolio_assets/apr-evidence-history.jpg
          grep -q 'FINAL BACKGROUND LOCK: original landing + lightning only' index.html
          grep -q 'Agent Proof Runtime' index.html
          grep -q 'id="mini-audit-form"' index.html
          grep -q 'footer-social-grid' index.html
          ! grep -q 'Agentic City' index.html
          ! grep -q 'Ładowanie portfolio' index.html
          ! grep -q '<iframe' index.html
          git config user.name 'OsaTechGPT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore approved preview and add APR screenshots plus footer'
          git push origin HEAD:main
