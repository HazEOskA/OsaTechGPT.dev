name: Apply final static portfolio

on:
  push:
    paths:
      - '.github/workflows/apply-static-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore approved static base
        run: git show 0a4ad8e7b4529141e34085302c7246be1132bc6b:index.html > index.html

      - name: Capture APR Mission and Audit screenshots
        shell: bash
        run: |
          mkdir -p osatechgpt_portfolio_assets
          npm init -y >/dev/null 2>&1
          npm install playwright@1.54.2 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > /tmp/apr-capture.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          await page.goto('https://apr-osatechgpt-landing.vercel.app',{waitUntil:'networkidle',timeout:120000});
          await page.waitForTimeout(5000);
          await page.screenshot({path:'osatechgpt_portfolio_assets/apr-mission.jpg',type:'jpeg',quality:82,fullPage:false});
          let switched=false;
          for (const frame of page.frames()) {
            for (const label of ['Audit','AUDIT','Verifier','VERIFIER']) {
              const target=frame.getByText(label,{exact:true}).first();
              if (await target.count()) {
                try { await target.click({timeout:2500}); switched=true; break; } catch {}
              }
            }
            if (switched) break;
          }
          await page.waitForTimeout(2500);
          await page.screenshot({path:'osatechgpt_portfolio_assets/apr-audit.jpg',type:'jpeg',quality:82,fullPage:false});
          await browser.close();
          JS
          node /tmp/apr-capture.mjs

      - name: Build final static HTML
        shell: bash
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')

          # Remove the previous lightning-only lock.
          text=re.sub(
              r'/\* FINAL BACKGROUND LOCK: original landing \+ lightning only \*/.*?@media\(prefers-reduced-motion:reduce\)\{\s*\.storm-flash\{display:none!important\}\s*\.storm-lightning\{display:none!important\}\s*\}\s*',
              '', text, count=1, flags=re.S
          )

          # Force the canvas lightning renderer even when the browser reports reduced motion.
          text=text.replace(
              "if(!canvas||!host||matchMedia('(prefers-reduced-motion: reduce)').matches)return;",
              "if(!canvas||!host)return;"
          )

          storm_css=r'''
          /* FINAL STORM LOCK — FULL ANIMATED BACKGROUND */
          .storm-premium{
            display:block!important;
            background:
              radial-gradient(ellipse at 50% -20%,rgba(41,54,75,.40),transparent 50%),
              linear-gradient(180deg,#050811 0%,#090d16 46%,#07090f 100%)!important;
          }
          .storm-premium::after,.storm-base,.storm-cloud,.storm-rain,.storm-city,.storm-haze,.storm-lightning,.storm-flash{display:block!important}
          .storm-cloud{animation:cloudDrift 31s ease-in-out infinite alternate!important}
          .storm-cloud.c2{animation:cloudDrift2 39s ease-in-out infinite alternate-reverse!important}
          .storm-cloud.c3{display:block!important;animation:cloudDrift3 47s ease-in-out infinite alternate!important}
          .storm-haze{animation:hazeMove 22s ease-in-out infinite alternate!important}
          .storm-rain{display:block!important;opacity:.10!important;animation:rainMove .72s linear infinite!important}
          .storm-flash{display:block!important;animation:stormFlash 11s linear infinite!important}
          .storm-city::before{animation:cityFlicker 7s ease-in-out infinite!important}
          .storm-lightning{display:block!important;opacity:.90!important}
          @media(max-width:700px){
            .storm-cloud.c3{display:block!important;opacity:.34!important}
            .storm-rain{display:block!important;opacity:.075!important}
            .storm-lightning{display:block!important;opacity:.88!important}
          }
          @media(prefers-reduced-motion:reduce){
            .storm-cloud{animation:cloudDrift 31s ease-in-out infinite alternate!important}
            .storm-cloud.c2{animation:cloudDrift2 39s ease-in-out infinite alternate-reverse!important}
            .storm-cloud.c3{display:block!important;animation:cloudDrift3 47s ease-in-out infinite alternate!important}
            .storm-haze{animation:hazeMove 22s ease-in-out infinite alternate!important}
            .storm-rain{display:block!important;animation:rainMove .72s linear infinite!important}
            .storm-lightning{display:block!important}
            .storm-flash{display:block!important;animation:stormFlash 11s linear infinite!important}
            .storm-city::before{animation:cityFlicker 7s ease-in-out infinite!important}
          }

          /* PREMIUM SOCIAL FOOTER */
          .footer-premium{position:relative;z-index:2;width:min(1180px,calc(100% - 40px));margin:auto;padding:58px 0 28px}
          .footer-top{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:end}
          .footer-brand{font-size:clamp(32px,5vw,62px);font-weight:950;letter-spacing:-.06em}.footer-brand b{color:var(--gold,#e0b155)}
          .footer-copy,.footer-audit p{color:rgba(255,255,255,.65);line-height:1.65}
          .footer-audit{padding:22px;border:1px solid rgba(224,177,85,.25);border-radius:18px;background:rgba(10,12,18,.82)}
          .footer-audit strong{font-size:20px}.footer-audit a{display:inline-flex;margin-top:12px;padding:11px 14px;border-radius:10px;background:var(--gold,#e0b155);color:#08090c;text-decoration:none;font-weight:900}
          .social-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin-top:34px}
          .social-card{--c:#fff;position:relative;min-height:150px;padding:18px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:linear-gradient(150deg,#111620,#080a10);color:#fff;text-decoration:none;overflow:hidden;transition:.22s}
          .social-card:after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;right:-45px;top:-45px;background:var(--c);opacity:.08}.social-card:hover{transform:translateY(-4px);border-color:var(--c)}
          .social-icon{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent)}
          .social-icon svg{width:25px;height:25px;fill:currentColor}.social-name{display:block;margin-top:20px;font-weight:900}.social-handle{display:block;margin-top:5px;color:#7f8794;font:600 9px var(--mono,monospace)}
          .github{--c:#eee}.linkedin{--c:#0a66c2}.instagram{--c:#e1306c}.x{--c:#eee}.facebook{--c:#1877f2}.pending{opacity:.45;cursor:not-allowed}
          .footer-bottom{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:34px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1);color:#707887;font:700 9px var(--mono,monospace);letter-spacing:.08em}
          @media(max-width:900px){.footer-top{grid-template-columns:1fr}.social-grid{grid-template-columns:repeat(2,1fr)}}
          @media(max-width:520px){.social-grid{grid-template-columns:1fr}}
          '''
          pos=text.rfind('</style>')
          if pos < 0: raise SystemExit('STYLE_END_NOT_FOUND')
          text=text[:pos]+storm_css+text[pos:]

          apr='''<article class="client-project-card">
            <div class="project-media apr-media" data-gallery>
              <div class="media-track">
                <figure class="media-slide active"><img src="osatechgpt_portfolio_assets/apr-mission.jpg" alt="Agent Proof Runtime — Mission Control"></figure>
                <figure class="media-slide"><img src="osatechgpt_portfolio_assets/apr-audit.jpg" alt="Agent Proof Runtime — Audit i Verifier"></figure>
              </div>
              <button class="media-nav media-prev" aria-label="Poprzedni screenshot APR">‹</button>
              <button class="media-nav media-next" aria-label="Następny screenshot APR">›</button>
              <span class="media-label">Agent Proof Runtime</span><span class="media-count">1 / 2</span>
            </div>
            <div class="project-status">LOCAL_VERIFIED · PRIVATE REPO</div>
            <h3>Agent Proof Runtime</h3>
            <p>Kontrolowane misje AI z Mission Studio, orkiestracją agentów, deterministycznym evidence, Proof Bundle, verifierem i Tamper Lab.</p>
            <div class="project-actions"><a href="https://apr-osatechgpt-landing.vercel.app" target="_blank" rel="noopener">ZOBACZ APR ↗</a></div>
          </article>'''
          pattern=r'<article class="client-project-card">\s*<div class="project-media" data-gallery>[\s\S]*?agentic-dashboard\.jpg[\s\S]*?</article>'
          if not re.search(pattern,text): raise SystemExit('AGENTIC_CARD_NOT_FOUND')
          text=re.sub(pattern,apr,text,count=1)

          gh='<svg viewBox="0 0 24 24"><path d="M12 .7a11.3 11.3 0 0 0-3.57 22.03c.57.1.77-.25.77-.55v-2.16c-3.15.69-3.81-1.34-3.81-1.34-.52-1.31-1.26-1.66-1.26-1.66-1.03-.7.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.74 2.66 1.24 3.31.95.1-.74.4-1.24.72-1.52-2.51-.29-5.15-1.26-5.15-5.59 0-1.24.44-2.25 1.17-3.04-.12-.29-.51-1.44.11-3 0 0 .95-.31 3.11 1.16a10.8 10.8 0 0 1 5.66 0C15.05 5.39 16 5.7 16 5.7c.62 1.56.23 2.71.11 3 .73.79 1.17 1.8 1.17 3.04 0 4.34-2.65 5.3-5.17 5.58.41.35.77 1.04.77 2.1v2.76c0 .3.21.66.78.55A11.3 11.3 0 0 0 12 .7Z"/></svg>'
          li='<svg viewBox="0 0 24 24"><path d="M5.3 3.5A2.8 2.8 0 1 1 5.3 9.1a2.8 2.8 0 0 1 0-5.6ZM3 10.7h4.7V21H3V10.7Zm7.8 0h4.5v1.4h.1c.6-1.2 2.2-2.5 4.5-2.5 4.8 0 5.7 3.2 5.7 7.4v4H21v-3.5c0-.8 0-1.9-1.1-1.9-1.2 0-1.4.9-1.4 1.8V21h-4.7V10.7Z" transform="scale(.86) translate(1.4 1.5)"/></svg>'
          ig='<svg viewBox="0 0 24 24"><path d="M7.2 2h9.6A5.2 5.2 0 0 1 22 7.2v9.6a5.2 5.2 0 0 1-5.2 5.2H7.2A5.2 5.2 0 0 1 2 16.8V7.2A5.2 5.2 0 0 1 7.2 2Zm0 2A3.2 3.2 0 0 0 4 7.2v9.6A3.2 3.2 0 0 0 7.2 20h9.6a3.2 3.2 0 0 0 3.2-3.2V7.2A3.2 3.2 0 0 0 16.8 4H7.2Zm10.3 1.5a1.3 1.3 0 1 1 0 2.5 1.3 1.3 0 0 1 0-2.5ZM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>'
          xx='<svg viewBox="0 0 24 24"><path d="M18.2 2H21l-6 6.9L22 22h-5.5l-4.3-5.6L7.3 22H4.5l6.4-7.3L4.2 2h5.6l3.9 5.1L18.2 2Zm-1 17.7h1.6L9 4.2H7.4l9.8 15.5Z"/></svg>'
          fb='<svg viewBox="0 0 24 24"><path d="M22 12.1C22 6.5 17.5 2 12 2S2 6.5 2 12.1C2 17.1 5.7 21.2 10.4 22v-7H7.9v-2.9h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.5h-1.3c-1.2 0-1.6.8-1.6 1.6v1.9h2.8l-.4 2.9h-2.4v7c4.8-.8 8.5-4.9 8.5-9.9Z"/></svg>'
          footer=f'''<footer class="site-footer"><div class="footer-premium"><div class="footer-top"><div><div class="footer-brand">OSA<b>TECHGPT</b>.DEV</div><p class="footer-copy">Systemy AI, aplikacje, automatyzacje i bezpieczne runtime’y budowane od architektury po działający deployment oraz dowód wykonania.</p></div><div class="footer-audit"><strong>Masz proces, który blokuje firmę?</strong><p>Formularz mini audytu jest widoczny bezpośrednio powyżej. Firmowy e-mail podłączymy po uruchomieniu Workspace.</p><a href="#kontakt">WRÓĆ DO MINI AUDYTU ↑</a></div></div><div class="social-grid"><a class="social-card github" href="https://github.com/HazEOskA" target="_blank" rel="noopener"><span class="social-icon">{gh}</span><span class="social-name">GitHub</span><span class="social-handle">@HazEOskA</span></a><a class="social-card linkedin" href="https://www.linkedin.com/in/bartosz-osi%C5%84ski-689490385" target="_blank" rel="noopener"><span class="social-icon">{li}</span><span class="social-name">LinkedIn</span><span class="social-handle">Bartosz Osiński</span></a><a class="social-card instagram" href="https://www.instagram.com/osatechgpt/" target="_blank" rel="noopener"><span class="social-icon">{ig}</span><span class="social-name">Instagram</span><span class="social-handle">@osatechgpt</span></a><span class="social-card x pending"><span class="social-icon">{xx}</span><span class="social-name">X</span><span class="social-handle">LINK DO PODPIĘCIA</span></span><span class="social-card facebook pending"><span class="social-icon">{fb}</span><span class="social-name">Facebook</span><span class="social-handle">LINK DO PODPIĘCIA</span></span></div><div class="footer-bottom"><span>© 2026 Bartosz Osiński · OsaTechGPT.dev</span><span>BUILD · VERIFY · DEPLOY</span></div></div></footer>'''
          footer_pattern=r'<footer class="site-footer">[\s\S]*?</footer>'
          if not re.search(footer_pattern,text): raise SystemExit('FOOTER_NOT_FOUND')
          text=re.sub(footer_pattern,footer,text,count=1)

          HTMLParser().feed(text)
          required=['Agent Proof Runtime','mini-audit-form','FINAL STORM LOCK','footer-premium','storm-lightning']
          for marker in required:
              if marker not in text: raise SystemExit('MISSING '+marker)
          if 'Ładowanie portfolio' in text or '<iframe' in text: raise SystemExit('FORBIDDEN_RUNTIME_LAYER')
          if text.count('class="client-project-card"') != 4: raise SystemExit('PROJECT_COUNT')
          p.write_text(text,encoding='utf-8')
          print('STATIC_HTML_PASS',len(text))
          PY
          python /tmp/patch.py

      - name: Remove temporary build machinery
        shell: bash
        run: |
          rm -rf package.json package-lock.json build.mjs vercel.json .static TEST_WRITE.txt source.br source-head.txt source-middle.txt source-tail.txt site-original.html
          rm -f .github/workflows/trigger-static-repair.yml .github/workflows/apply-static-portfolio.yml

      - name: Commit final static site
        shell: bash
        run: |
          git config user.name 'OsaTechGPT Static Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: publish static portfolio with full storm, APR audit and footer'
          git push origin main
